<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 515" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="515" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">How the containers sit in memory</text>

  <!-- std::array -->
  <text x="24" y="78" font-weight="600" fill="#0f172a">std::array&lt;int,5&gt;</text>
  <text x="24" y="96" fill="#475569" font-size="12">fixed size, contiguous</text>
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="200" y="62" width="44" height="34"/><rect x="244" y="62" width="44" height="34"/>
    <rect x="288" y="62" width="44" height="34"/><rect x="332" y="62" width="44" height="34"/>
    <rect x="376" y="62" width="44" height="34"/>
  </g>
  <g fill="#0f172a" text-anchor="middle"><text x="222" y="84">3</text><text x="266" y="84">1</text><text x="310" y="84">4</text><text x="354" y="84">1</text><text x="398" y="84">5</text></g>
  <text x="440" y="84" fill="#475569" font-size="12">a[i] is O(1); size can't change, values can</text>

  <!-- std::vector -->
  <text x="24" y="150" font-weight="600" fill="#0f172a">std::vector&lt;int&gt;</text>
  <text x="24" y="168" fill="#475569" font-size="12">growable, contiguous</text>
  <rect x="200" y="122" width="80" height="34" rx="4" fill="#f1f5f9" stroke="#475569"/>
  <text x="240" y="136" text-anchor="middle" font-size="11" fill="#475569">ptr · size 4</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#475569">capacity 8</text>
  <path d="M280,139 L318,139" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <g fill="#dbeafe" stroke="#2563eb">
    <rect x="320" y="122" width="40" height="34"/><rect x="360" y="122" width="40" height="34"/>
    <rect x="400" y="122" width="40" height="34"/><rect x="440" y="122" width="40" height="34"/>
  </g>
  <g fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3">
    <rect x="480" y="122" width="40" height="34"/><rect x="520" y="122" width="40" height="34"/>
    <rect x="560" y="122" width="40" height="34"/><rect x="600" y="122" width="40" height="34"/>
  </g>
  <g fill="#0f172a" text-anchor="middle"><text x="340" y="144">7</text><text x="380" y="144">2</text><text x="420" y="144">9</text><text x="460" y="144">4</text></g>
  <text x="400" y="176" text-anchor="middle" font-size="12" fill="#2563eb">size (in use)</text>
  <text x="560" y="176" text-anchor="middle" font-size="12" fill="#64748b">spare capacity</text>
  <text x="655" y="144" fill="#475569" font-size="12">heap buffer</text>

  <!-- std::list -->
  <text x="24" y="232" font-weight="600" fill="#0f172a">std::list&lt;int&gt;</text>
  <text x="24" y="250" fill="#475569" font-size="12">doubly linked nodes,</text>
  <text x="24" y="266" fill="#475569" font-size="12">scattered on the heap</text>
  <g fill="#ffedd5" stroke="#ea580c">
    <rect x="200" y="212" width="90" height="40" rx="6"/>
    <rect x="350" y="232" width="90" height="40" rx="6"/>
    <rect x="500" y="208" width="90" height="40" rx="6"/>
  </g>
  <g font-size="11" fill="#7c2d12" text-anchor="middle">
    <text x="245" y="229">prev | 10 | next</text>
    <text x="395" y="249">prev | 20 | next</text>
    <text x="545" y="225">prev | 30 | next</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M290,236 L348,246" marker-end="url(#ar)"/>
    <path d="M348,262 L292,248" marker-end="url(#ar)"/>
    <path d="M440,244 L498,232" marker-end="url(#ar)"/>
    <path d="M498,242 L442,256" marker-end="url(#ar)"/>
  </g>
  <text x="610" y="236" fill="#475569" font-size="12">no [i]: walk node by node</text>
  <text x="610" y="252" fill="#475569" font-size="12">insert/erase at an iterator: O(1)</text>

  <!-- std::map -->
  <text x="24" y="320" font-weight="600" fill="#0f172a">std::map&lt;K,V&gt;</text>
  <text x="24" y="338" fill="#475569" font-size="12">balanced tree,</text>
  <text x="24" y="354" fill="#475569" font-size="12">keys kept sorted</text>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="330" y1="320" x2="270" y2="372"/><line x1="330" y1="320" x2="390" y2="372"/>
    <line x1="270" y1="372" x2="235" y2="420"/><line x1="390" y1="372" x2="425" y2="420"/>
  </g>
  <g fill="#dcfce7" stroke="#16a34a">
    <rect x="290" y="302" width="80" height="30" rx="15"/>
    <rect x="230" y="358" width="80" height="30" rx="15"/>
    <rect x="350" y="358" width="80" height="30" rx="15"/>
    <rect x="195" y="408" width="80" height="30" rx="15"/>
    <rect x="385" y="408" width="80" height="30" rx="15"/>
  </g>
  <g font-size="12" fill="#14532d" text-anchor="middle">
    <text x="330" y="321">fig:1</text><text x="270" y="377">bean:4</text><text x="390" y="377">pear:3</text>
    <text x="235" y="427">apple:5</text><text x="425" y="427">plum:2</text>
  </g>
  <text x="500" y="350" fill="#475569" font-size="12">find / insert / erase: O(log n)</text>
  <text x="500" y="366" fill="#475569" font-size="12">iterates in key order</text>

  <!-- std::unordered_map -->
  <text x="24" y="472" font-weight="600" fill="#0f172a">std::unordered_map</text>
  <text x="24" y="490" fill="#475569" font-size="12">hash table of buckets</text>
  <g fill="#f3e8ff" stroke="#9333ea">
    <rect x="200" y="460" width="50" height="30"/><rect x="250" y="460" width="50" height="30"/>
    <rect x="300" y="460" width="50" height="30"/><rect x="350" y="460" width="50" height="30"/>
  </g>
  <g font-size="11" fill="#581c87" text-anchor="middle">
    <text x="225" y="479">fig</text><text x="275" y="479">—</text><text x="325" y="479">pear</text><text x="375" y="479">apple</text>
  </g>
  <text x="420" y="472" fill="#475569" font-size="12">hash(key) → bucket: O(1) average, O(n) worst</text>
  <text x="420" y="488" fill="#475569" font-size="12">no ordering guarantee</text>
</svg>
