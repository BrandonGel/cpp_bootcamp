<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="780" height="330" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">Loop scheduling with uneven work (iteration i costs ∝ i, 3 threads)</text>
  <text x="24" y="56" fill="#475569" font-size="12">Bar length = time each thread spends. Colour = which block of iterations it ran. The loop ends when the LAST thread finishes.</text>

  <!-- static -->
  <text x="24" y="96" font-weight="600" fill="#0f172a">schedule(static)</text>
  <text x="24" y="112" fill="#475569" font-size="12">equal-size blocks, fixed up front</text>
  <g font-size="11">
    <text x="210" y="92" fill="#475569">T0</text><rect x="235" y="81" width="60" height="16" fill="#bfdbfe"/><text x="300" y="93" fill="#475569">i 0–99 (cheap)</text>
    <text x="210" y="114" fill="#475569">T1</text><rect x="235" y="103" width="180" height="16" fill="#93c5fd"/><text x="420" y="115" fill="#475569">i 100–199</text>
    <text x="210" y="136" fill="#475569">T2</text><rect x="235" y="125" width="300" height="16" fill="#3b82f6"/><text x="540" y="137" fill="#475569">i 200–299 (expensive)</text>
  </g>
  <line x1="535" y1="76" x2="535" y2="146" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="660" y="114" fill="#dc2626" font-size="12">T0, T1 sit idle</text>

  <!-- dynamic -->
  <text x="24" y="186" font-weight="600" fill="#0f172a">schedule(dynamic, c)</text>
  <text x="24" y="202" fill="#475569" font-size="12">chunks handed out on demand</text>
  <g>
    <rect x="235" y="171" width="30" height="16" fill="#bfdbfe"/><rect x="265" y="171" width="70" height="16" fill="#93c5fd"/><rect x="335" y="171" width="80" height="16" fill="#3b82f6"/>
    <rect x="235" y="193" width="40" height="16" fill="#bfdbfe"/><rect x="275" y="193" width="60" height="16" fill="#93c5fd"/><rect x="335" y="193" width="85" height="16" fill="#3b82f6"/>
    <rect x="235" y="215" width="50" height="16" fill="#bfdbfe"/><rect x="285" y="215" width="55" height="16" fill="#93c5fd"/><rect x="340" y="215" width="78" height="16" fill="#3b82f6"/>
  </g>
  <g stroke="#ffffff" stroke-width="1">
    <line x1="255" y1="171" x2="255" y2="187"/><line x1="300" y1="171" x2="300" y2="187"/><line x1="375" y1="171" x2="375" y2="187"/>
    <line x1="260" y1="193" x2="260" y2="209"/><line x1="305" y1="193" x2="305" y2="209"/><line x1="380" y1="193" x2="380" y2="209"/>
    <line x1="262" y1="215" x2="262" y2="231"/><line x1="315" y1="215" x2="315" y2="231"/><line x1="378" y1="215" x2="378" y2="231"/>
  </g>
  <g font-size="11" fill="#475569"><text x="210" y="183">T0</text><text x="210" y="205">T1</text><text x="210" y="227">T2</text></g>
  <line x1="420" y1="166" x2="420" y2="236" stroke="#16a34a" stroke-dasharray="4 3"/>
  <text x="440" y="198" fill="#16a34a" font-size="12">balanced → finishes much earlier</text>
  <text x="440" y="214" fill="#475569" font-size="12">(small cost: threads coordinate per chunk)</text>

  <line x1="24" y1="252" x2="756" y2="252" stroke="#e2e8f0"/>
  <g font-size="12" fill="#0f172a">
    <text x="24" y="276"><tspan font-weight="600">static</tspan> – equal-cost iterations (array maths). Lowest overhead.</text>
    <text x="24" y="294"><tspan font-weight="600">dynamic</tspan> – uneven or unpredictable cost. Pick a chunk large enough to amortize the hand-out.</text>
    <text x="24" y="312"><tspan font-weight="600">guided</tspan> – like dynamic, but chunks start large and shrink: less overhead, still balances the tail.</text>
  </g>
</svg>
